[project]
name = "uosbuddy-ai"
version = "0.1.0"
description = "UOSBuddy AI service: chat, OCR pre-check, moderation and embeddings (filled in from Phase 1)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
